title: PrintBeam
# Homepage <title>. Carries the terms developers actually search for; keep it under
# 60 characters so Google doesn't truncate it in results.
seo_title: "PrintBeam · ESC/POS Printer SDK for Android, iOS & KMP"
description: ESC/POS thermal printing for Android, iOS, and Kotlin Multiplatform. One API for network and Bluetooth LE receipt printers, with a Kotlin receipt DSL.
# Shown in the homepage's structured data. Bump on each release.
sdk_version: "0.1.0-alpha04"
url: "https://kotimadduluri.github.io"
baseurl: "/printbeam-sdk"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Every markdown page renders through our own layout. Files without front matter
# (the Dokka output under api/, the Maven tree, Package.swift) are static and untouched.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Kept in the repo (GitHub renders them there) but not published as pages: README.md
# duplicates the homepage almost verbatim, and both would otherwise be served as raw
# markdown competing with the real pages in search results.
exclude:
  - README.md
  - LICENSE.md
